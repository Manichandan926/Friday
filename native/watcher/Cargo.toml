[package]
name = "friday_watcher"
version = "0.1.0"
edition = "2021"

[dependencies]
# Safe wrappers for inotify / statvfs / getifaddrs; everything else is
# plain /proc and /sys file reads through std.
nix = { version = "0.29", features = ["inotify", "net", "fs"] }

[profile.release]
# Tuned for a small always-on daemon: <10MB RSS is the budget.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
